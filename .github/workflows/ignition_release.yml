name: Ignition Release

on:
  push:
    tags:
      - "v*-ignition*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v9.2.1-ignition.1)"
        required: true

permissions:
  contents: write

jobs:

  generate-soh-otr:
    name: "Generate soh.o2r"
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-otr-ignition-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ignition-ccache-
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool
    - name: Restore Cached deps folder
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-deps-ignition-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deps-ignition-
          ${{ runner.os }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Install latest SDL
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Install latest tinyxml2
      run: |
        sudo apt-get remove libtinyxml2-dev
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/tinyxml2-10.0.0" ]; then
          wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz -C deps
        fi
        cd deps/tinyxml2-10.0.0
        mkdir -p build
        cd build
        cmake ..
        make
        sudo make install
    - name: Generate soh.o2r
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-cmake --config Release --target GenerateSohOtr -j3
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v7
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 1

  build-windows:
    name: "Windows"
    needs: generate-soh-otr
    runs-on: windows-latest
    steps:
    - name: Install dependencies
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Configure sccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: sccache
        max-size: "2G"
        evict-old-files: job
        key: ${{ runner.os }}-ignition-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ignition-ccache-
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-vcpkg-ignition-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-ignition-
          ${{ runner.os }}-vcpkg-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Download soh.o2r
      uses: actions/download-artifact@v7
      with:
        name: soh.o2r
        path: build-windows/soh
    - name: Build SoH
      env:
        VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      run: |
        set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
        cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_REMOTE_CONTROL=1
        cmake --build build-windows --config Release --parallel 10
        (cd build-windows && cpack)
        cd ..
        mv _packages/*.zip _packages/soh-windows.zip
    - name: Save Cached VCPKG folder
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
        path: vcpkg
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-windows
        path: _packages/soh-windows.zip

  build-linux:
    name: "Linux (x86_64)"
    needs: generate-soh-otr
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt)
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ignition-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ignition-ccache-
    - name: Restore Cached deps folder
      id: restore-cache-deps
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-deps-ignition-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deps-ignition-
          ${{ runner.os }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    # [MIRROR] Dependency builds below track generate-builds.yml build-linux.
    - name: Install latest SDL
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Install latest SDL_net
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/SDL2_net-2.2.0" ]; then
          wget https://www.libsdl.org/projects/SDL_net/release/SDL2_net-2.2.0.tar.gz
          tar -xzf SDL2_net-2.2.0.tar.gz -C deps
        fi
        cd deps/SDL2_net-2.2.0
        ./configure
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Install latest tinyxml2
      run: |
        sudo apt-get remove libtinyxml2-dev
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/tinyxml2-10.0.0" ]; then
          wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz -C deps
        fi
        cd deps/tinyxml2-10.0.0
        mkdir -p build
        cd build
        cmake ..
        make
        sudo make install
    - name: Install libzip without crypto
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        if [ ! -d "deps/libzip-1.10.1" ]; then
          wget https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
          tar -xzf libzip-1.10.1.tar.gz -C deps
        fi
        cd deps/libzip-1.10.1
        mkdir -p build
        cd build
        cmake .. -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
        make
        sudo make install
        sudo cp -av /usr/local/lib/libzip* /lib/x86_64-linux-gnu/
    - name: Download soh.o2r
      uses: actions/download-artifact@v7
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      env:
        CC: gcc-12
        CXX: g++-12
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake --config Release -j3
        (cd build-cmake && cpack -G External)
    # Fixed artifact name; create-release applies the tag (same as build-windows).
    - name: Collect AppImage
      run: |
        shopt -s nullglob
        sources=( build-cmake/*.appimage build-cmake/*.AppImage )
        if [ "${#sources[@]}" -eq 0 ]; then
          echo "No AppImage produced by cpack" >&2
          ls -la build-cmake
          exit 1
        fi
        mkdir -p out
        mv "${sources[0]}" "out/soh-linux.AppImage"
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-linux
        path: out/*.AppImage
        if-no-files-found: error

  build-macos:
    name: "macOS (universal)"
    needs: generate-soh-otr
    runs-on: macos-14
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true
        key: ${{ runner.os }}-14-ignition-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-14-ignition-ccache-
    # Needed to apply sudo for macports cache restore
    - name: Install gtar wrapper
      run: |
        sudo mv /opt/homebrew/bin/gtar /opt/homebrew/bin/gtar.orig
        sudo cp .github/workflows/gtar /opt/homebrew/bin/gtar
        sudo chmod +x /opt/homebrew/bin/gtar
    - name: Restore Cached MacPorts
      id: restore-cache-macports
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-14-macports-${{ hashFiles('.github/workflows/macports-deps.txt') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-14-macports-${{ hashFiles('.github/workflows/macports-deps.txt') }}-
          ${{ runner.os }}-14-macports-
        path: /opt/local/
    # [MIRROR] MacPorts version tracks generate-builds.yml build-macos.
    - name: Install MacPorts (if necessary)
      run: |
        if command -v /opt/local/bin/port 2>&1 >/dev/null; then
          echo "MacPorts already installed"
        else
          echo "Installing MacPorts"
          wget https://github.com/macports/macports-base/releases/download/v2.11.5/MacPorts-2.11.5-14-Sonoma.pkg
          sudo installer -pkg ./MacPorts-2.11.5-14-Sonoma.pkg -target /
        fi
        echo "/opt/local/bin:/opt/local/sbin" >> "$GITHUB_PATH"
    - name: Install dependencies
      run: |
        brew uninstall --ignore-dependencies libpng
        sudo port install $(cat .github/workflows/macports-deps.txt)
        brew install ninja
    - name: Download soh.o2r
      uses: actions/download-artifact@v7
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        export PATH="/usr/lib/ccache:/opt/homebrew/opt/ccache/libexec:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake --config Release --parallel 10
        (cd build-cmake && cpack)
    # Ignition installs by extracting an archive and running a known binary path,
    # so ship soh.app as a tarball rather than the .dmg cpack emits.
    - name: Extract soh.app from the disk image
      run: |
        shopt -s nullglob
        images=( _packages/*.dmg )
        if [ "${#images[@]}" -eq 0 ]; then
          echo "No .dmg produced by cpack" >&2
          ls -la _packages || true
          exit 1
        fi
        hdiutil attach "${images[0]}" -mountpoint /tmp/sohdmg -nobrowse -readonly
        if [ ! -d "/tmp/sohdmg/soh.app" ]; then
          echo "soh.app not found in disk image" >&2
          ls -la /tmp/sohdmg
          hdiutil detach /tmp/sohdmg
          exit 1
        fi
        mkdir -p out stage
        cp -R "/tmp/sohdmg/soh.app" stage/
        hdiutil detach /tmp/sohdmg
        tar -czf "out/soh-macos.tar.gz" -C stage soh.app
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-macos
        path: out/*.tar.gz
        if-no-files-found: error

  create-release:
    name: "Create Release"
    needs: [generate-soh-otr, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
    - name: Determine tag
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
        else
          echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        fi
    - name: Download platform builds
      uses: actions/download-artifact@v7
      with:
        pattern: soh-*
        merge-multiple: true
        path: ./artifacts/
    - name: Rename artifacts
      env:
        TAG: ${{ steps.tag.outputs.value }}
      run: |
        cd ./artifacts
        mv soh-windows.zip     "soh-${TAG}-windows-x64.zip"
        mv soh-linux.AppImage  "soh-${TAG}-linux-x86_64.AppImage"
        mv soh-macos.tar.gz    "soh-${TAG}-macos-universal.tar.gz"
        for f in *; do
          sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
        done
        ls -la
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TAG: ${{ steps.tag.outputs.value }}
      run: |
        PRERELEASE_FLAG=""
        if [[ "$TAG" == *"-rc"* ]]; then
          PRERELEASE_FLAG="--prerelease"
        else
          PRERELEASE_FLAG="--latest"
        fi
        gh release create "${TAG}" \
          --repo ignition-emu/soh \
          --title "${TAG}" \
          --notes "Ignition build of Ship of Harkinian (Windows, Linux, macOS)" \
          ${PRERELEASE_FLAG} \
          ./artifacts/*
